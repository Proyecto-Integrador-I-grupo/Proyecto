<section id="estudiantes-view" class="view hidden">
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center gap-3 mb-3 flex-wrap">
        <h2 class="card-title-serif h5 mb-0"><i class="bi bi-people-fill"></i> Pre-registro de Estudiantes</h2>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <div class="input-group input-group-sm search-box">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="persona-search" type="text" class="form-control" placeholder="Buscar por nombre...">
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-abrir-modal-estudiante" data-bs-toggle="modal" data-bs-target="#modalEstudiante">
            <i class="bi bi-plus-lg"></i> Agregar Estudiante
          </button>
        </div>
      </div>
      <p class="text-muted small mb-3">
        <i class="bi bi-info-circle"></i>
        Este es el pre-registro del estudiante. La asignación a un grupo se hace luego desde el módulo de <strong>Matrícula</strong>.
      </p>
      <div class="table-responsive">
        <table id="personas-table" class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre Completo</th>
              <th>Nacimiento</th>
              <th>Ingreso</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
