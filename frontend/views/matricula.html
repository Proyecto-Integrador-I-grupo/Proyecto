<section id="matricula-view" class="view hidden">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm text-center p-3 h-100">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <i class="bi bi-journal-plus text-primary fs-1 mb-2"></i>
          <h3 class="h5">Nueva Matrícula</h3>
          <p class="text-muted small mb-3">Asigna un estudiante a un grupo de clase.</p>
          <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modalMatricula">Procesar Matrícula</button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm text-center p-3 h-100">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <i class="bi bi-person-badge text-primary fs-1 mb-2"></i>
          <h3 class="h5">Profesores</h3>
          <p class="text-muted small mb-3">Registra y edita el cuerpo docente.</p>
          <button type="button" class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#modalProfesor">Agregar Profesor</button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm text-center p-3 h-100">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <i class="bi bi-people text-primary fs-1 mb-2"></i>
          <h3 class="h5">Grupos</h3>
          <p class="text-muted small mb-3">Configura las aulas y capacidades.</p>
          <button type="button" class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#modalGrupo">Crear Grupo</button>
        </div>
      </div>
    </div>
  </div>
</section>
