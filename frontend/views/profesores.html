<section id="profesores-view" class="view hidden">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-4 flex-wrap">
    <div>
      <h2 class="card-title-serif h4 mb-1"><i class="bi bi-person-badge"></i> Cuerpo Docente</h2>
      <p class="text-muted small mb-0">Gestiona el registro, la disponibilidad y la asignación de grupos del personal docente.</p>
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProfesor">
      <i class="bi bi-plus-lg"></i> Agregar Profesor
    </button>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="card stat-card stat-card-sm stat-card-primary shadow-sm h-100">
        <div class="card-body py-3">
          <span class="stat-label">Total Registrados</span>
          <div id="prof-cnt-total" class="stat-value stat-value-sm">–</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card stat-card stat-card-sm stat-card-success shadow-sm h-100">
        <div class="card-body py-3">
          <span class="stat-label">Activos</span>
          <div id="prof-cnt-activos" class="stat-value stat-value-sm">–</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card stat-card stat-card-sm stat-card-danger shadow-sm h-100">
        <div class="card-body py-3">
          <span class="stat-label">Inactivos / Destituidos</span>
          <div id="prof-cnt-inactivos" class="stat-value stat-value-sm">–</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card stat-card stat-card-sm stat-card-gold shadow-sm h-100">
        <div class="card-body py-3">
          <span class="stat-label">Grupos por Restaurar</span>
          <div id="prof-cnt-pendientes" class="stat-value stat-value-sm">–</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center gap-3 mb-3 flex-wrap">
        <div class="input-group input-group-sm search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="prof-search" type="text" class="form-control" placeholder="Buscar por nombre o materia...">
        </div>
        <select id="prof-filtro-estado" class="form-select form-select-sm" style="width: auto;">
          <option value="todos">Todos los profesores</option>
          <option value="activos">Solo activos</option>
          <option value="inactivos">Solo inactivos / destituidos</option>
        </select>
      </div>
      <div class="table-responsive">
        <table id="profesores-table" class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre Completo</th>
              <th>Materia</th>
              <th>Ingreso</th>
              <th>Grupos</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
